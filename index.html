<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JARVIS — עוזר רב־סוכנים</title>
<style>
  :root{
    --bg:#070b12;
    --bg-2:#0b111c;
    --panel:rgba(16,22,34,.72);
    --panel-solid:#101624;
    --border:rgba(120,160,220,.14);
    --border-strong:rgba(120,190,255,.35);
    --text:#e7eef7;
    --muted:#8a97a8;
    --accent:#38bdf8;
    --accent-2:#f5c542;
    --user:#1c2b3d;
    --danger:#ff6b6b;
    --ok:#3ddc84;
    --radius:16px;
    --font:'Segoe UI',system-ui,-apple-system,'Arial','Noto Sans Hebrew',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--font);color:var(--text);
    background:
      radial-gradient(1100px 700px at 80% -10%,rgba(56,189,248,.14),transparent 60%),
      radial-gradient(900px 600px at 0% 110%,rgba(245,197,66,.08),transparent 55%),
      var(--bg);
    display:flex;flex-direction:column;align-items:center;
  }
  .app{
    width:min(920px,100%);height:100dvh;display:flex;flex-direction:column;
    padding:16px;gap:14px;
  }

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:14px;
    background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px 16px;backdrop-filter:blur(12px);
  }
  .reactor{width:40px;height:40px;flex:none;position:relative}
  .reactor svg{width:100%;height:100%;display:block}
  .reactor .spin{transform-origin:50% 50%;animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .titles{flex:1;min-width:0}
  .titles h1{margin:0;font-size:19px;letter-spacing:.14em;font-weight:700}
  .titles p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 0 rgba(0,0,0,0)}
  .dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .dot.bad{background:var(--danger);box-shadow:0 0 10px var(--danger)}
  .icon-btn{
    background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);
    width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:16px;
    display:grid;place-items:center;transition:.15s;
  }
  .icon-btn:hover{border-color:var(--border-strong);background:rgba(56,189,248,.12)}

  /* ---------- chat ---------- */
  .chat{
    flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;
    padding:6px 4px;scroll-behavior:smooth;
  }
  .chat::-webkit-scrollbar{width:8px}
  .chat::-webkit-scrollbar-thumb{background:rgba(120,160,220,.2);border-radius:4px}
  .msg{display:flex;gap:10px;max-width:88%}
  .msg.user{align-self:flex-start;flex-direction:row-reverse}
  .msg.bot{align-self:flex-end}
  .avatar{
    width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
    font-size:13px;font-weight:700;margin-top:2px;
  }
  .msg.user .avatar{background:var(--user);color:#cfe1f5}
  .msg.bot .avatar{background:linear-gradient(135deg,#0ea5e9,#38bdf8);color:#04121d}
  .bubble{
    background:var(--panel);border:1px solid var(--border);
    padding:11px 14px;border-radius:14px;font-size:14.5px;line-height:1.65;
    word-wrap:break-word;overflow-wrap:anywhere;
  }
  .msg.user .bubble{background:var(--user);border-color:rgba(120,160,220,.22)}
  .msg.bot .bubble{border-color:var(--border-strong)}
  .bubble p{margin:0 0 8px}
  .bubble p:last-child{margin:0}
  .bubble h1,.bubble h2,.bubble h3{margin:10px 0 6px;font-size:15px;line-height:1.4}
  .bubble ul,.bubble ol{margin:6px 0;padding-inline-start:22px}
  .bubble li{margin:3px 0}
  .bubble a{color:var(--accent)}
  .bubble code{
    background:rgba(255,255,255,.08);padding:1.5px 5px;border-radius:5px;
    font-family:ui-monospace,Consolas,monospace;font-size:12.5px;direction:ltr;display:inline-block;
  }
  .bubble pre{
    background:#0a0f18;border:1px solid var(--border);border-radius:10px;
    padding:12px;overflow-x:auto;direction:ltr;text-align:left;margin:8px 0;
  }
  .bubble pre code{background:none;padding:0;font-size:12.5px;line-height:1.55}
  .time{font-size:10.5px;color:var(--muted);margin-top:5px;opacity:.7}

  .typing{display:flex;gap:4px;align-items:center;padding:4px 2px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bounce 1.2s infinite ease-in-out}
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}

  /* ---------- composer ---------- */
  .composer{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px;backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:10px;
  }
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);
    font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer;transition:.15s;font-family:inherit;
  }
  .chip:hover{color:var(--text);border-color:var(--border-strong);background:rgba(56,189,248,.1)}
  .chip.gold:hover{border-color:var(--accent-2);background:rgba(245,197,66,.12)}
  .input-row{display:flex;gap:10px;align-items:flex-end}
  textarea{
    flex:1;resize:none;background:rgba(0,0,0,.25);border:1px solid var(--border);
    color:var(--text);border-radius:12px;padding:11px 13px;font-family:inherit;font-size:14.5px;
    line-height:1.5;max-height:160px;outline:none;transition:.15s;
  }
  textarea:focus{border-color:var(--border-strong);background:rgba(0,0,0,.35)}
  .send{
    flex:none;width:44px;height:44px;border-radius:12px;border:none;cursor:pointer;
    background:linear-gradient(135deg,#0ea5e9,#38bdf8);color:#04121d;font-size:18px;
    display:grid;place-items:center;transition:.15s;
  }
  .send:hover{filter:brightness(1.1)}
  .send:disabled{opacity:.45;cursor:not-allowed}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(3,6,12,.72);backdrop-filter:blur(4px);
    display:none;place-items:center;padding:20px;z-index:50;
  }
  .overlay.open{display:grid}
  .modal{
    width:min(480px,100%);background:var(--panel-solid);border:1px solid var(--border-strong);
    border-radius:var(--radius);padding:22px;
  }
  .modal h2{margin:0 0 4px;font-size:17px;letter-spacing:.05em}
  .modal p.hint{margin:0 0 16px;font-size:12.5px;color:var(--muted);line-height:1.6}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .field input[type=text]{
    width:100%;background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13.5px;direction:ltr;text-align:left;
  }
  .field input:focus{outline:none;border-color:var(--border-strong)}
  .radio-row{display:flex;gap:16px;font-size:13px}
  .radio-row label{display:flex;align-items:center;gap:6px;color:var(--text);cursor:pointer}
  .modal-actions{display:flex;gap:10px;margin-top:20px}
  .btn{
    flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);cursor:pointer;
    font-family:inherit;font-size:13.5px;background:rgba(255,255,255,.04);color:var(--text);transition:.15s;
  }
  .btn:hover{border-color:var(--border-strong)}
  .btn.primary{background:linear-gradient(135deg,#0ea5e9,#38bdf8);color:#04121d;border:none;font-weight:600}
  .test-result{font-size:12.5px;margin-top:10px;min-height:18px}
  .test-result.ok{color:var(--ok)}
  .test-result.bad{color:var(--danger)}
  .err{color:var(--danger)}
  @media(max-width:560px){
    .app{padding:10px}
    .titles p{display:none}
    .msg{max-width:95%}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="reactor" title="JARVIS">
      <svg viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="46" stroke="#1e3550" stroke-width="3"/>
        <g class="spin">
          <circle cx="50" cy="50" r="38" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 10" opacity=".8"/>
        </g>
        <circle cx="50" cy="50" r="26" stroke="#38bdf8" stroke-width="2" opacity=".5"/>
        <circle class="pulse" cx="50" cy="50" r="15" fill="#38bdf8"/>
        <circle cx="50" cy="50" r="15" stroke="#bfeaff" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="titles">
      <h1>JARVIS</h1>
      <p>העוזר האישי החכם שלך — זמין 24/7</p>
    </div>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">בודק חיבור…</span></div>
    <button class="icon-btn" id="newChatBtn" title="שיחה חדשה">⟳</button>
    <button class="icon-btn" id="settingsBtn" title="הגדרות">⚙</button>
  </header>

  <div class="chat" id="chat"></div>

  <div class="composer">
    <div class="chips">
      <button class="chip gold" data-prefix="שלח את השאלה הבאה לכל המחלקות: ">כל המחלקות</button>
      <button class="chip" data-prefix="מחקר: ">מחקר ומקורות</button>
      <button class="chip" data-prefix="תכנון: ">תכנון משימות</button>
      <button class="chip" data-prefix="קוד: ">עזרה בקוד</button>
      <button class="chip" data-prefix="דעה שנייה מקלוד: ">דעה שנייה (Claude)</button>
    </div>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="כתוב את השאלה שלך…"></textarea>
      <button class="send" id="sendBtn" title="שליחה">➤</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>הגדרות חיבור</h2>
    <p class="hint">חבר את האתר ל־webhook של ה־Chat Trigger ב־n8n. ברירת המחדל מותאמת ל־n8n שרץ מקומית והוורקפלואו פעיל (Production).</p>
    <div class="field">
      <label>כתובת בסיס של n8n</label>
      <input type="text" id="cfgBase" placeholder="http://localhost:5678" dir="ltr"/>
    </div>
    <div class="field">
      <label>Webhook ID של ה־Chat Trigger</label>
      <input type="text" id="cfgId" placeholder="e92be7e4-3947-4cbf-830b-5f89627fbf4c" dir="ltr"/>
    </div>
    <div class="field">
      <label>מצב</label>
      <div class="radio-row">
        <label><input type="radio" name="mode" value="prod"/> Production (וורקפלואו פעיל)</label>
        <label><input type="radio" name="mode" value="test"/> Test (לחיצת "Execute workflow")</label>
      </div>
    </div>
    <button class="btn" id="testBtn" style="flex:none;width:100%">בדיקת חיבור</button>
    <div class="test-result" id="testResult"></div>
    <div class="modal-actions">
      <button class="btn" id="cancelBtn">ביטול</button>
      <button class="btn primary" id="saveBtn">שמירה</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const DEFAULTS = {
    base: "https://haimkripisn.app.n8n.cloud",
    id: "e92be7e4-3947-4cbf-830b-5f89627fbf4c",
    mode: "prod",
    v: 2
  };
  const LS_CFG = "jarvis_config";
  const LS_SESSION = "jarvis_session";
  const LS_HISTORY = "jarvis_history";
  const GREETING = "שלום, אני JARVIS. איך אפשר לעזור?";

  const $ = s => document.querySelector(s);
  const chatEl = $("#chat");
  const inputEl = $("#input");
  const sendBtn = $("#sendBtn");
  const statusDot = $("#statusDot");
  const statusText = $("#statusText");

  let cfg = loadCfg();
  let sessionId = loadSession();
  let history = loadHistory();
  let busy = false;

  /* ---------- config / session ---------- */
  function loadCfg(){
    try{
      const saved = JSON.parse(localStorage.getItem(LS_CFG) || "{}");
      // migrate: if saved config is from an older version, start from current defaults
      if(saved.v !== DEFAULTS.v){
        const migrated = Object.assign({}, DEFAULTS);
        try{ localStorage.setItem(LS_CFG, JSON.stringify(migrated)); }catch(e){}
        return migrated;
      }
      return Object.assign({}, DEFAULTS, saved);
    }
    catch(e){ return Object.assign({}, DEFAULTS); }
  }
  function saveCfg(c){ cfg = c; try{ localStorage.setItem(LS_CFG, JSON.stringify(c)); }catch(e){} }
  function loadSession(){
    let s = null;
    try{ s = localStorage.getItem(LS_SESSION); }catch(e){}
    if(!s){ s = uuid(); try{ localStorage.setItem(LS_SESSION, s); }catch(e){} }
    return s;
  }
  function newSession(){
    sessionId = uuid();
    try{ localStorage.setItem(LS_SESSION, sessionId); localStorage.removeItem(LS_HISTORY); }catch(e){}
    history = [];
    chatEl.innerHTML = "";
    addBot(GREETING, false);
  }
  function uuid(){
    if(crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{
      const r = Math.random()*16|0, v = c==="x"?r:(r&0x3|0x8); return v.toString(16);
    });
  }
  function webhookUrl(){
    const base = (cfg.base || DEFAULTS.base).replace(/\/+$/,"");
    const seg = cfg.mode === "test" ? "webhook-test" : "webhook";
    return `${base}/${seg}/${cfg.id || DEFAULTS.id}/chat`;
  }

  /* ---------- history ---------- */
  function loadHistory(){
    try{ return JSON.parse(localStorage.getItem(LS_HISTORY) || "[]"); }catch(e){ return []; }
  }
  function persist(){
    try{ localStorage.setItem(LS_HISTORY, JSON.stringify(history.slice(-120))); }catch(e){}
  }

  /* ---------- rendering ---------- */
  function esc(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function mdToHtml(src){
    // fenced code blocks first
    const blocks = [];
    src = src.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
      blocks.push(`<pre><code>${esc(code.replace(/\n$/,""))}</code></pre>`);
      return `␀${blocks.length-1}␀`;
    });
    src = esc(src);
    src = src.replace(/`([^`]+)`/g,"<code>$1</code>");
    src = src.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
    src = src.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
    src = src.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    src = src.replace(/(^|[\s(])((https?:\/\/[^\s<)]+))/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');

    const lines = src.split("\n");
    let html = "", listType = null;
    const closeList = ()=>{ if(listType){ html += `</${listType}>`; listType = null; } };
    for(let line of lines){
      const raw = line.trim();
      if(raw === ""){ closeList(); continue; }
      const restore = raw.replace(/␀(\d+)␀/g,(m,i)=>blocks[+i]);
      if(/^␀\d+␀$/.test(raw)){ closeList(); html += restore; continue; }
      let m;
      if(m = raw.match(/^(#{1,3})\s+(.*)$/)){ closeList(); const n = m[1].length; html += `<h${n}>${m[2]}</h${n}>`; continue; }
      if(m = raw.match(/^[-*]\s+(.*)$/)){ if(listType !== "ul"){ closeList(); html += "<ul>"; listType = "ul"; } html += `<li>${m[1]}</li>`; continue; }
      if(m = raw.match(/^\d+[.)]\s+(.*)$/)){ if(listType !== "ol"){ closeList(); html += "<ol>"; listType = "ol"; } html += `<li>${m[1]}</li>`; continue; }
      closeList();
      html += `<p>${restore}</p>`;
    }
    closeList();
    return html;
  }

  function timeNow(){
    const d = new Date();
    return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
  }

  function addMsg(role, text, save=true){
    const wrap = document.createElement("div");
    wrap.className = "msg " + (role === "user" ? "user" : "bot");
    const av = document.createElement("div");
    av.className = "avatar";
    av.textContent = role === "user" ? "את/ה" : "J";
    if(role === "user") av.textContent = "🧑";
    const bub = document.createElement("div");
    bub.className = "bubble";
    bub.innerHTML = mdToHtml(text) + `<div class="time">${timeNow()}</div>`;
    wrap.appendChild(av); wrap.appendChild(bub);
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    if(save){ history.push({role, text}); persist(); }
    return wrap;
  }
  const addUser = (t,s)=>addMsg("user",t,s);
  const addBot = (t,s)=>addMsg("bot",t,s);

  function showTyping(){
    const wrap = document.createElement("div");
    wrap.className = "msg bot";
    wrap.id = "typing";
    wrap.innerHTML = `<div class="avatar">J</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
  }
  function hideTyping(){ const t = $("#typing"); if(t) t.remove(); }

  /* ---------- networking ---------- */
  function extractReply(data){
    if(data == null) return "";
    if(typeof data === "string") return data;
    if(Array.isArray(data)) return extractReply(data[0]);
    if(typeof data === "object"){
      return data.output ?? data.text ?? data.response ?? data.message ?? data.answer ??
             (data.json ? extractReply(data.json) : null) ?? JSON.stringify(data, null, 2);
    }
    return String(data);
  }

  async function send(text){
    if(busy || !text.trim()) return;
    busy = true; sendBtn.disabled = true;
    addUser(text);
    inputEl.value = ""; autoGrow();
    showTyping();

    try{
      const res = await fetch(webhookUrl(), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "sendMessage", sessionId, chatInput: text, route: "" })
      });
      hideTyping();
      if(!res.ok){
        let detail = "";
        try{ detail = (await res.text()).slice(0,300); }catch(e){}
        addBot(httpErrorHint(res.status, detail), false);
        setStatus(res.status === 404 ? "bad" : "ok", res.status === 404 ? "Webhook לא רשום" : "מחובר");
      }else{
        const ct = res.headers.get("content-type") || "";
        const data = ct.includes("json") ? await res.json() : await res.text();
        const reply = extractReply(data).trim() || "_(לא התקבל טקסט תשובה מהוורקפלואו)_";
        addBot(reply);
        setStatus("ok","מחובר");
      }
    }catch(err){
      hideTyping();
      addBot(networkErrorHint(err), false);
      setStatus("bad","אין חיבור");
    }finally{
      busy = false; sendBtn.disabled = false; inputEl.focus();
    }
  }

  function httpErrorHint(status, detail){
    const d = detail ? `\n\n\`\`\`\n${detail}\n\`\`\`` : "";
    if(status === 404) return `**שגיאה 404 — ה־webhook לא נמצא.**\n\n- אם המצב הוא *Production*: ודא שהוורקפלואו **Active** ב־n8n.\n- אם המצב הוא *Test*: לחץ "Execute workflow" ב־n8n ואז שלח שוב.\n- בדוק ש־Webhook ID בהגדרות תואם ל־Chat Trigger.${d}`;
    if(status === 500) return `**שגיאה 500 — הוורקפלואו נכשל בריצה.**\n\nבדוק את לוג ההרצות (Executions) ב־n8n — כנראה תקלה באחד הסוכנים או במפתחות ה־API.${d}`;
    return `**שגיאת שרת ${status}.**${d}`;
  }
  function networkErrorHint(err){
    return `**לא הצלחתי להגיע ל־n8n.**\n\nכתובת: \`${webhookUrl()}\`\n\nבדוק:\n- ש־n8n רץ (\`${cfg.base}\`) ונגיש מהדפדפן.\n- שהוורקפלואו פעיל (Active) והמצב בהגדרות נכון.\n- אם פתחת את הקובץ כ־\`file://\` וקיים חסימת CORS — הגש אותו דרך שרת מקומי (למשל \`python -m http.server\`) או דרך n8n עצמו.\n\n\`${err && err.message ? err.message : err}\``;
  }

  async function setStatus(kind, text){
    statusDot.className = "dot" + (kind ? " " + kind : "");
    statusText.textContent = text;
  }

  async function ping(){
    setStatus("", "בודק חיבור…");
    try{
      await fetch((cfg.base||DEFAULTS.base).replace(/\/+$/,"") + "/healthz", { mode:"no-cors" });
      setStatus("ok","מחובר ל־n8n");
    }catch(e){
      setStatus("bad","n8n לא נגיש");
    }
  }

  /* ---------- composer ---------- */
  function autoGrow(){
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  }
  inputEl.addEventListener("input", autoGrow);
  inputEl.addEventListener("keydown", e=>{
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(inputEl.value); }
  });
  sendBtn.addEventListener("click", ()=>send(inputEl.value));

  document.querySelectorAll(".chip").forEach(c=>{
    c.addEventListener("click", ()=>{
      const p = c.dataset.prefix;
      if(!inputEl.value.startsWith(p)) inputEl.value = p + inputEl.value.replace(/^(שלח את השאלה הבאה לכל המחלקות: |מחקר: |תכנון: |קוד: |דעה שנייה מקלוד: )/,"");
      inputEl.focus(); autoGrow();
    });
  });

  $("#newChatBtn").addEventListener("click", ()=>{
    if(confirm("להתחיל שיחה חדשה? ההיסטוריה הנוכחית תימחק.")) newSession();
  });

  /* ---------- settings modal ---------- */
  const overlay = $("#overlay");
  function openSettings(){
    $("#cfgBase").value = cfg.base;
    $("#cfgId").value = cfg.id;
    document.querySelector(`input[name=mode][value="${cfg.mode}"]`).checked = true;
    $("#testResult").textContent = "";
    overlay.classList.add("open");
  }
  function closeSettings(){ overlay.classList.remove("open"); }
  $("#settingsBtn").addEventListener("click", openSettings);
  $("#cancelBtn").addEventListener("click", closeSettings);
  overlay.addEventListener("click", e=>{ if(e.target === overlay) closeSettings(); });
  $("#saveBtn").addEventListener("click", ()=>{
    saveCfg({
      base: $("#cfgBase").value.trim() || DEFAULTS.base,
      id: $("#cfgId").value.trim() || DEFAULTS.id,
      mode: document.querySelector("input[name=mode]:checked").value,
      v: DEFAULTS.v
    });
    closeSettings();
    ping();
  });
  $("#testBtn").addEventListener("click", async ()=>{
    const rEl = $("#testResult");
    rEl.textContent = "בודק…"; rEl.className = "test-result";
    const base = $("#cfgBase").value.trim() || DEFAULTS.base;
    const id = $("#cfgId").value.trim() || DEFAULTS.id;
    const mode = document.querySelector("input[name=mode]:checked").value;
    const url = `${base.replace(/\/+$/,"")}/${mode==="test"?"webhook-test":"webhook"}/${id}/chat`;
    try{
      const res = await fetch(url, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ action:"sendMessage", sessionId:"jarvis-test-"+Date.now(), chatInput:"בדיקת חיבור" })
      });
      if(res.ok){ rEl.textContent = "✓ החיבור תקין — הוורקפלואו הגיב."; rEl.className = "test-result ok"; }
      else if(res.status === 404){ rEl.textContent = "✗ 404 — ודא שהוורקפלואו Active (Production) או שלחצת Execute (Test)."; rEl.className = "test-result bad"; }
      else{ rEl.textContent = `✗ שרת החזיר ${res.status}.`; rEl.className = "test-result bad"; }
    }catch(e){
      rEl.textContent = "✗ אין גישה ל־n8n בכתובת הזו (בדוק שהשרת רץ / CORS).";
      rEl.className = "test-result bad";
    }
  });

  /* ---------- boot ---------- */
  if(history.length){
    history.forEach(m=>addMsg(m.role, m.text, false));
  }else{
    addBot(GREETING, false);
  }
  ping();
  autoGrow();
  inputEl.focus();
})();
</script>
</body>
</html>
